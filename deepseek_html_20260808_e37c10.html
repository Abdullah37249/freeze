<!DOCTYPE html>
<html>
<head>
<title>Freeze</title>
<style>
* { margin: 0; padding: 0; }
body { 
  width: 100vw; 
  height: 100vh; 
  background: #000;
}
</style>
</head>
<body>
<script>
// Method 1: Block main thread with heavy math + DOM writes
(function freezeChrome() {
  const start = Date.now();
  const target = 120000; // 2 minutes
  
  // Create 1000 DOM elements to increase memory pressure
  for (let i = 0; i < 1000; i++) {
    const div = document.createElement('div');
    div.style.cssText = `width:100px;height:100px;background:red;position:absolute;top:${i}px;`;
    document.body.appendChild(div);
  }
  
  // Busy loop with heavy calculations + forced reflow
  while (Date.now() - start < target) {
    // Force reflow every iteration
    document.body.offsetHeight;
    // Heavy math
    for (let j = 0; j < 1000; j++) {
      Math.sin(Math.random() * 100000);
      Math.cos(Math.random() * 100000);
      Math.sqrt(Math.random() * 100000);
    }
    // Write to DOM to trigger repaint
    document.body.style.backgroundColor = `rgb(${Math.random()*255},0,0)`;
  }
  
  document.write('✅ Unlocked');
})();
</script>
</body>
</html>
