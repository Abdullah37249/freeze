<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ff88;
            font-family: monospace;
            font-size: 24px;
            user-select: none;
        }
        .spinner {
            border: 4px solid #1a1a1a;
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin-right: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .container {
            display: flex;
            align-items: center;
            background: #111;
            padding: 30px 50px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,255,136,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <span>Initializing secure session...</span>
    </div>

    <script>
        // Wait 200ms so the UI renders first
        setTimeout(function() {
            // Block main thread for 120 seconds (2 minutes)
            const start = Date.now();
            while (Date.now() - start < 120000) {
                // Busy loop — consumes 100% CPU on one core
                // No break — keeps UI thread frozen
            }
            // After 2 minutes, page becomes responsive again
            document.body.innerHTML = `
                <div style="
                    height: 100vh;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    background: #0a0a0a;
                    color: #00ff88;
                    font-family: monospace;
                    font-size: 28px;
                ">
                    ✓ Session complete. Device unlocked.
                </div>
            `;
        }, 200);
    </script>
</body>
</html>
